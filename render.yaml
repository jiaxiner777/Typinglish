# Short-term beta. Free Render Postgres expires after 30 days.
services:
  - type: web
    name: typinglish-beta
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:production
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: typinglish-beta-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true

databases:
  - name: typinglish-beta-db
    plan: free
    region: singapore
    databaseName: typinglish
    user: typinglish
    postgresMajorVersion: "17"
    ipAllowList: []
